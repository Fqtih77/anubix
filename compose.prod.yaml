services:
  web:
    build: .
    env_file: .env.local
    environment:
      ANUBIX_DATA_DIR: /app/data
      ANUBIX_HTTPS: "true"
    expose:
      - "3005"
    volumes:
      - anubix_data:/app/data
    restart: unless-stopped

  mail:
    build: .
    env_file: .env.local
    environment:
      ANUBIX_DATA_DIR: /app/data
    command: ["node", "scripts/mail-worker.mjs"]
    volumes:
      - anubix_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  anubix_data:
  caddy_data:
  caddy_config:
